# Render blueprint — MediQuick prescription API.
#
# Render injects PORT itself and src/index.js already reads it, so PORT is
# deliberately NOT set here; hardcoding it would break the health check.
#
# DATABASE_URL must be the Supabase **Session pooler** string, not the direct
# one. db.<ref>.supabase.co resolves to IPv6 only and Render has no outbound
# IPv6, so the direct URL deploys green and then fails every query with
# ENETUNREACH. Copy the pooler URI from Supabase -> Connect, and percent-encode
# any @ in the password as %40.
services:
  - type: web
    name: mediquick-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # Public route that touches the database, so a green health check proves
    # the pooler connection actually works.
    healthCheckPath: /api/v1/pharmacies
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set in the Render dashboard. Never committed.
      - key: DATABASE_URL
        sync: false
      # clerkMiddleware() needs BOTH Clerk keys. Without the publishable key
      # every request fails with 500 "Publishable key is missing" before it
      # reaches a route.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
